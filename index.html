<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--ARTIFACT-HEAD-->
<title>MIZIN PHOTOGRAPHY</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="MIZIN PHOTOGRAPHY — фотосерии: репортаж, пейзаж, события в Армении.">
<meta name="theme-color" content="#0b1017">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans+Condensed:wght@400;500;600&family=Fira+Sans:wght@300;400;500&family=Noto+Sans+Armenian:wdth,wght@62.5..100,300..700&display=swap">
<link rel="stylesheet" href="assets/style.css">
<!-- значок Instagram из набора Font Awesome -->
<script defer src="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/js/brands.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/js/fontawesome.min.js"></script>
<!--/ARTIFACT-HEAD-->
</head>
<body>
<!--ARTIFACT-BODY-->
<header class="top" id="top">
  <a class="logo" href="#" aria-label="MIZIN PHOTOGRAPHY">
    <b>MIZIN</b><span>PHOTOGRAPHY</span>
  </a>
  <nav class="top-nav">
    <a href="#" class="nav-series" data-i18n="nav.series" data-scroll="series">Серии</a>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="ru">РУ</button>
      <button type="button" data-lang="en">EN</button>
      <button type="button" data-lang="hy">ՀՅ</button>
    </div>
    <a class="btn btn-accent btn-sm" href="#support" data-scroll="support" data-i18n="support.short">Поддержать</a>
  </nav>
</header>

<main id="view"></main>

<section class="support" id="support" aria-labelledby="support-title">
  <div class="wrap support-inner">
    <h2 id="support-title" data-i18n="support.title">Буду вам очень благодарен, если поддержите моё творчество!</h2>
    <p class="support-sub" data-i18n="support.sub"></p>
    <a class="ig-link" id="support-ig" href="#" target="_blank" rel="noopener" hidden aria-label="Instagram"><span class="ig-ico"><i class="fa-brands fa-instagram" aria-hidden="true"></i></span><b id="support-ig-name"></b></a>
    <div class="pay-links" id="pay-links"></div>
    <div class="card-block" id="card-block">
      <p class="or" data-i18n="support.or">или можете скопировать номер карты</p>
      <div class="card-row">
        <span class="card-num" id="card-num"></span>
        <button type="button" class="copy" id="copy-card" aria-label="Copy">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="8" y="8" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M16 8V4H4v12h4" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
          <span data-i18n="support.copy">Копировать</span>
        </button>
      </div>
      <p class="card-holder" id="card-holder"></p>
    </div>
  </div>
</section>

<footer class="foot">
  <div class="wrap foot-inner">
    <span class="logo logo-sm"><b>MIZIN</b><span>PHOTOGRAPHY</span></span>
    <span class="foot-links" id="foot-links"></span>
    <span class="foot-copy">© <span id="year">2026</span> · <span data-i18n="foot.rights">Все права защищены</span></span>
  </div>
</footer>

<div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="Photo">
  <div class="lb-stage" id="lb-stage"><img id="lb-img" alt=""></div>
  <div class="lb-bar">
    <span class="lb-count" id="lb-count"></span>
    <span class="lb-title" id="lb-title"></span>
  </div>
  <button type="button" class="lb-btn lb-close" id="lb-close" aria-label="Close">
    <svg viewBox="0 0 24 24" width="26" height="26"><path d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>
  </button>
  <button type="button" class="lb-btn lb-prev" id="lb-prev" aria-label="Previous">
    <svg viewBox="0 0 24 24" width="30" height="30"><path d="M15 4l-8 8 8 8" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>
  </button>
  <button type="button" class="lb-btn lb-next" id="lb-next" aria-label="Next">
    <svg viewBox="0 0 24 24" width="30" height="30"><path d="M9 4l8 8-8 8" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>
  </button>
</div>

<div class="toast" id="toast" hidden role="status" aria-live="polite">
  <p id="toast-text"></p>
  <a class="btn btn-accent btn-sm" href="#support" data-scroll="support" id="toast-cta" data-i18n="support.short">Поддержать</a>
  <button type="button" class="toast-x" id="toast-x" aria-label="Close">
    <svg viewBox="0 0 24 24" width="18" height="18"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>
  </button>
</div>

<script src="config.js"></script>
<script src="data/series.js"></script>
<script src="assets/app.js"></script>
<!--/ARTIFACT-BODY-->
</body>
</html>
